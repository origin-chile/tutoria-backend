<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutorIA — Verificando acceso...</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0f;color:#f0f0f8;font-family:'DM Sans',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
.card{background:#13131a;border:1px solid #252535;border-radius:20px;padding:48px 40px;max-width:420px;width:100%}
.icon{font-size:48px;margin-bottom:20px;display:block}
h1{font-family:'Syne',sans-serif;font-size:24px;font-weight:800;margin-bottom:10px}
p{color:#8888aa;font-size:15px;line-height:1.6;margin-bottom:20px}
.spinner{width:40px;height:40px;border:3px solid #252535;border-top-color:#6c63ff;border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 20px}
.btn{display:inline-flex;align-items:center;gap:8px;background:#6c63ff;color:#fff;border:none;border-radius:10px;padding:14px 28px;font-family:'Syne',sans-serif;font-weight:700;font-size:15px;cursor:pointer;text-decoration:none;transition:.2s}
.btn:hover{background:#7c74ff}
.btn-wa{background:#22c55e}
.btn-wa:hover{background:#16a34a}
.error-box{background:rgba(220,38,38,.08);border:1px solid rgba(220,38,38,.2);border-radius:10px;padding:16px;margin-bottom:20px;font-size:14px;color:#fca5a5}
.success-box{background:rgba(34,197,94,.08);border:1px solid rgba(34,197,94,.2);border-radius:10px;padding:16px;margin-bottom:20px;font-size:14px;color:#86efac}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="spinner" id="spinner"></div>
  <h1 id="title">Verificando tu pago...</h1>
  <p id="msg">Estamos confirmando tu acceso con Flow. Esto toma unos segundos.</p>
</div>
<script>
async function verificar(){
  const params = new URLSearchParams(window.location.search);
  const flowToken = params.get('token');
  const directCode = params.get('code');

  // Si viene con código directo (link manual)
  if(directCode){
    await activarAcceso(directCode);
    return;
  }

  // Si viene de Flow con su token
  if(flowToken){
    // Esperar un poco para que llegue el webhook
    await new Promise(r => setTimeout(r, 2500));
    try{
      const res = await fetch(`/api/access/by-flow?token=${flowToken}`);
      if(res.ok){
        const d = await res.json();
        await activarAcceso(d.code, d.plan);
        return;
      }
    }catch(e){}
    // Si no encontró el token aún, mostrar error con WhatsApp
    mostrarError(flowToken);
    return;
  }

  // Sin token — mostrar error
  mostrarError();
}

async function activarAcceso(code, plan){
  try{
    const res = await fetch(`/api/access/check?token=${code}`);
    if(!res.ok) throw new Error('inválido');
    const d = await res.json();

    // Guardar en localStorage con expiración
    const session = {code, plan: d.plan, expires: d.expires, days_left: d.days_left};
    localStorage.setItem('tutoria_session', JSON.stringify(session));

    // Mostrar éxito y redirigir
    document.getElementById('spinner').style.display='none';
    document.getElementById('title').textContent='¡Acceso activado! 🎉';
    document.getElementById('msg').innerHTML=`
      <div class="success-box">Plan <strong>${d.plan}</strong> activado · ${d.days_left} días disponibles</div>
      Redirigiendo al tutor...
    `;
    setTimeout(()=> window.location.href='/tutor', 2000);
  }catch(e){
    mostrarError();
  }
}

function mostrarError(flowToken){
  document.getElementById('spinner').style.display='none';
  document.getElementById('title').textContent='Hmm, algo falló';
  const wa = `https://wa.me/56900000000?text=Hola,%20pagué%20TutorIA%20y%20no%20pude%20acceder.%20Mi%20token:%20${flowToken||'sin-token'}`;
  document.getElementById('msg').innerHTML=`
    <div class="error-box">No pudimos verificar tu pago automáticamente.</div>
    <p style="margin-bottom:16px">No te preocupes — escríbenos por WhatsApp y te activamos el acceso en minutos.</p>
    <a href="${wa}" class="btn btn-wa" target="_blank">💬 Contactar por WhatsApp</a>
  `;
}

verificar();
</script>
</body>
</html>
