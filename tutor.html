<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TutorIA — Media y Universidad</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@9.1.6/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f7f5f0;--surface:#fff;--surface2:#f0ede6;--border:#e2ddd5;--ink:#1a1814;--ink2:#5a5650;--ink3:#9a9590;--accent:#2563eb;--accent-bg:#eff4ff;--purple:#7c3aed;--purple-bg:#f5f3ff}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',sans-serif;font-size:15px;line-height:1.6;min-height:100vh}
.app{max-width:920px;margin:0 auto;padding:28px 16px 80px;display:grid;grid-template-columns:260px 1fr;gap:18px;align-items:start}
@media(max-width:680px){.app{grid-template-columns:1fr}}
.sidebar{background:var(--surface);border:1px solid var(--border);border-radius:14px;overflow:hidden;position:sticky;top:16px}
.sidebar-header{padding:16px 18px;border-bottom:1px solid var(--border)}
.logo{font-size:17px;font-weight:700;display:flex;align-items:center;gap:7px}
.logo-dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
.logo-sub{font-size:11px;color:var(--ink3);margin-top:2px}
.level-tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:10px 12px;border-bottom:1px solid var(--border)}
.ltab{padding:7px;border-radius:8px;border:1.5px solid var(--border);background:transparent;font-family:'Space Grotesk',sans-serif;font-size:12px;font-weight:600;cursor:pointer;transition:.15s;text-align:center}
.ltab:hover{background:var(--surface2)}
.ltab.active-u{border-color:var(--accent);background:var(--accent-bg);color:var(--accent)}
.ltab.active-m{border-color:var(--purple);background:var(--purple-bg);color:var(--purple)}
.subject-list{padding:8px;max-height:340px;overflow-y:auto}
.subject-list::-webkit-scrollbar{width:3px}
.subject-list::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
.subj{display:flex;align-items:center;gap:9px;padding:8px 9px;border-radius:8px;cursor:pointer;transition:.15s;border:1.5px solid transparent}
.subj:hover{background:var(--surface2)}
.subj.active{background:var(--accent-bg);border-color:rgba(37,99,235,.2)}
.subj.active-m{background:var(--purple-bg);border-color:rgba(124,58,237,.2)}
.subj-icon{width:30px;height:30px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0}
.subj-name{font-size:13px;font-weight:600}
.subj-sub{font-size:10px;color:var(--ink3)}
.subj.active .subj-name{color:var(--accent)}
.subj.active-m .subj-name{color:var(--purple)}
.sf{padding:10px 14px;border-top:1px solid var(--border);background:var(--surface2);font-size:11px;color:var(--ink3);line-height:1.5}
.main{display:flex;flex-direction:column;gap:12px}
.mh{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.mh-top{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.mh-icon{width:40px;height:40px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:19px}
.mh-title{font-size:18px;font-weight:700}
.mh-sub{font-size:12px;color:var(--ink3)}
.level-badge{display:inline-flex;align-items:center;padding:2px 9px;border-radius:100px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-left:8px}
.lb-u{background:var(--accent-bg);color:var(--accent)}
.lb-m{background:var(--purple-bg);color:var(--purple)}
.topics{display:flex;flex-wrap:wrap;gap:5px}
.tbtn{padding:4px 11px;border-radius:100px;border:1px solid var(--border);background:transparent;font-family:'Space Grotesk',sans-serif;font-size:11px;font-weight:500;color:var(--ink2);cursor:pointer;transition:.15s}
.tbtn:hover{background:var(--accent-bg);border-color:rgba(37,99,235,.3);color:var(--accent)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mbtn{padding:10px 6px;border-radius:10px;border:1.5px solid var(--border);background:var(--surface);cursor:pointer;transition:.15s;text-align:center;font-family:'Space Grotesk',sans-serif}
.mbtn:hover,.mbtn.active{border-color:var(--accent);background:var(--accent-bg)}
.mbtn span:first-child{font-size:17px;display:block;margin-bottom:2px}
.mbtn .ml{font-size:12px;font-weight:600;display:block}
.mbtn .ms{font-size:10px;color:var(--ink3);display:block;margin-top:1px}
.chat{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px;min-height:200px}
.empty{text-align:center;padding:32px 14px;color:var(--ink3)}
.empty-e{font-size:34px;margin-bottom:9px}
.empty-t{font-size:14px;font-weight:600;color:var(--ink2);margin-bottom:3px}
.qs{display:flex;flex-wrap:wrap;gap:5px;margin-top:10px;justify-content:center}
.qbtn{padding:4px 10px;border-radius:100px;border:1px solid var(--border);background:var(--surface);font-size:11px;color:var(--ink2);cursor:pointer;transition:.15s;font-family:'Space Grotesk',sans-serif}
.qbtn:hover{background:var(--accent-bg);border-color:rgba(37,99,235,.3);color:var(--accent)}
.msg{margin-bottom:14px;animation:fi .3s ease}
.msg-u{display:flex;justify-content:flex-end}
.bu{background:var(--accent);color:#fff;border-radius:14px 14px 4px 14px;padding:9px 13px;max-width:75%;font-size:14px;line-height:1.6}
.msg-a{display:flex;gap:9px}
.av{width:28px;height:28px;border-radius:7px;background:var(--accent-bg);border:1px solid rgba(37,99,235,.2);display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;margin-top:2px}
.av-m{background:var(--purple-bg);border-color:rgba(124,58,237,.2)}
.ac{flex:1}
.an{font-size:10px;font-weight:600;color:var(--accent);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
.an-m{color:var(--purple)}
.ab{background:var(--surface2);border:1px solid var(--border);border-radius:4px 14px 14px 14px;padding:14px 16px;font-size:14px;line-height:1.8}
.ab h1,.ab h2,.ab h3{font-family:'Space Grotesk',sans-serif;font-weight:700;margin:14px 0 6px;color:var(--ink)}
.ab h1{font-size:17px}
.ab h2{font-size:15px}
.ab h3{font-size:14px}
.ab p{margin-bottom:10px}
.ab ul,.ab ol{padding-left:20px;margin-bottom:10px}
.ab li{margin-bottom:4px}
.ab strong{font-weight:600;color:var(--ink)}
.ab em{font-style:italic}
.ab code{background:var(--border);padding:1px 6px;border-radius:4px;font-family:monospace;font-size:13px}
.ab pre{background:var(--border);padding:12px;border-radius:8px;overflow-x:auto;margin-bottom:10px}
.ab pre code{background:none;padding:0}
.ab table{width:100%;border-collapse:collapse;margin-bottom:12px;font-size:13px}
.ab th{background:var(--border);padding:7px 10px;text-align:left;font-weight:600}
.ab td{padding:6px 10px;border-bottom:1px solid var(--border)}
.ab hr{border:none;border-top:1px solid var(--border);margin:12px 0}
.ab .katex{font-size:1em}
.ab .katex-display{overflow-x:auto;margin:10px 0}
.typing{display:flex;gap:4px;align-items:center;padding:10px 13px;background:var(--surface2);border:1px solid var(--border);border-radius:4px 14px 14px 14px;width:fit-content}
.typing span{width:5px;height:5px;border-radius:50%;background:var(--ink3);animation:bo .8s infinite}
.typing span:nth-child(2){animation-delay:.15s}
.typing span:nth-child(3){animation-delay:.3s}
.ia{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.ial{font-size:11px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.06em;margin-bottom:7px}
.ir{display:flex;gap:8px;align-items:flex-end}
textarea{flex:1;background:var(--surface2);border:1.5px solid var(--border);border-radius:8px;padding:10px 12px;font-family:'Space Grotesk',sans-serif;font-size:14px;color:var(--ink);resize:none;outline:none;transition:.2s;line-height:1.6;min-height:66px}
textarea:focus{border-color:var(--accent);background:#fff}
textarea::placeholder{color:var(--ink3)}
.sb{width:40px;height:40px;background:var(--accent);border:none;border-radius:8px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.sb:hover{background:#1d4ed8}
.sb:disabled{opacity:.4;cursor:not-allowed}
.sb svg{width:16px;height:16px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.err{background:rgba(220,38,38,.07);border:1px solid rgba(220,38,38,.2);border-radius:6px;padding:9px 12px;font-size:13px;color:#dc2626}
@keyframes fi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
@keyframes bo{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
</style>
</head>
<body>
<div class="app">
  <div class="sidebar">
    <div class="sidebar-header">
      <div class="logo"><div class="logo-dot"></div>TutorIA</div>
      <div class="logo-sub">Media y Universidad · Chile</div>
    </div>
    <div class="level-tabs">
      <button class="ltab active-u" onclick="setLevel('u',this)">🎓 Universidad</button>
      <button class="ltab" onclick="setLevel('m',this)">📚 Media</button>
    </div>
    <div class="subject-list" id="subjectList"></div>
    <div class="sf">Adaptado al currículo chileno — MINEDUC y universidades del CRUCH.</div>
  </div>
  <div class="main">
    <div class="mh">
      <div class="mh-top">
        <div class="mh-icon" id="mhIcon">📐</div>
        <div>
          <div class="mh-title" id="mhTitle">Cálculo I <span class="level-badge lb-u">Universidad</span></div>
          <div class="mh-sub" id="mhSub">Límites · Derivadas · Integrales</div>
        </div>
      </div>
      <div class="topics" id="topicsRow"></div>
    </div>
    <div class="modes">
      <button class="mbtn active" data-mode="explicar" onclick="setMode(this)"><span>💡</span><span class="ml">Explicar</span><span class="ms">Entender el concepto</span></button>
      <button class="mbtn" data-mode="ejercicio" onclick="setMode(this)"><span>✏️</span><span class="ml">Ejercicio</span><span class="ms">Practicar paso a paso</span></button>
      <button class="mbtn" data-mode="prueba" onclick="setMode(this)"><span>📝</span><span class="ml">Mini prueba</span><span class="ms">Testear lo aprendido</span></button>
    </div>
    <div class="chat" id="chatArea">
      <div class="empty" id="emptyState">
        <div class="empty-e">👋</div>
        <div class="empty-t">¿Qué no entiendes hoy?</div>
        <div style="font-size:13px">Pregunta cualquier duda — te explico paso a paso.</div>
        <div class="qs" id="quickQ"></div>
      </div>
      <div id="messages"></div>
    </div>
    <div class="ia">
      <div class="ial" id="inputLabel">¿Qué quieres que explique?</div>
      <div class="ir">
        <textarea id="userInput" placeholder="Ej: No entiendo las derivadas..." rows="2" onkeydown="handleKey(event)"></textarea>
        <button class="sb" id="sendBtn" onclick="sendMessage()">
          <svg viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>
<script>
const API_URL = window.location.origin + "/api/chat";

marked.setOptions({breaks:true,gfm:true});

function renderMarkdown(text){
  const html = marked.parse(text);
  const div = document.createElement('div');
  div.innerHTML = html;
  renderMathInElement(div,{
    delimiters:[
      {left:'$$',right:'$$',display:true},
      {left:'$',right:'$',display:false},
      {left:'\\(',right:'\\)',display:false},
      {left:'\\[',right:'\\]',display:true}
    ],
    throwOnError:false
  });
  return div.innerHTML;
}

const data={
  u:[
    {id:'calculo',name:'Cálculo I',sub:'Límites · Derivadas · Integrales',icon:'📐',bg:'#eff4ff',topics:['Límites','Derivadas','Regla de la cadena','Integrales','Teorema fundamental',"L'Hôpital"],quick:["¿Qué es un límite?","Explícame la regla de la cadena","¿Cómo resolver una integral?","¿Cuándo usar L'Hôpital?"]},
    {id:'estadistica',name:'Estadística',sub:'Probabilidad · Distribuciones · Tests',icon:'📊',bg:'#f0fdf4',topics:['Probabilidad','Distribución normal','IC','Test de hipótesis','Regresión lineal','Chi-cuadrado'],quick:['¿Qué es el p-valor?','Diferencia media y mediana','¿Cuándo usar t-student?','¿Cómo interpretar un IC?']},
    {id:'fisica',name:'Física I',sub:'Mecánica · Cinemática · Dinámica',icon:'⚡',bg:'#fffbeb',topics:['Cinemática','2ª ley Newton','Trabajo y energía','Movimiento circular','Gravitación','Choques'],quick:['¿Qué es aceleración?','Trabajo vs energía','¿Cómo resuelvo un proyectil?','Conservación del momentum']},
    {id:'quimica',name:'Química General',sub:'Enlace · Estequiometría · Equilibrio',icon:'🧪',bg:'#fdf4ff',topics:['Estequiometría','Enlace químico','Gases ideales','Equilibrio','Ácidos y bases','Termodinámica'],quick:['¿Cómo balanceo ecuaciones?','¿Qué es el pH?','Enlace iónico vs covalente','Ley de gases ideales']},
    {id:'prog',name:'Programación',sub:'Python · Algoritmos · Estructuras',icon:'💻',bg:'#f0fdf4',topics:['Variables','Condicionales','Ciclos','Funciones','Listas','Recursión'],quick:['¿Qué es una función?','¿Cómo funciona el for?','Lista vs diccionario','¿Qué es recursión?']},
    {id:'contab',name:'Contabilidad',sub:'Balance · Resultados · Costos',icon:'🧾',bg:'#fff7ed',topics:['Ecuación contable','Asientos','Balance general','Estado resultados','Flujo de caja','Costos'],quick:['¿Qué es un asiento contable?','Activo vs pasivo','¿Cómo leer un balance?','¿Qué es depreciación?']},
  ],
  m:[
    {id:'mat_m',name:'Matemática',sub:'Álgebra · Geometría · Funciones · PAES',icon:'📐',bg:'#f5f3ff',topics:['Álgebra','Funciones','Ecuaciones','Geometría','Trigonometría','Probabilidad'],quick:['¿Cómo resuelvo ecuación de 2° grado?','¿Qué es una función?','Teorema de Pitágoras','¿Cómo calculo probabilidad?']},
    {id:'cien_m',name:'Ciencias',sub:'Biología · Física · Química · PAES',icon:'🔬',bg:'#f0fdf4',topics:['Célula','ADN y herencia','Ecosistemas','Fuerzas','Energía','Tabla periódica'],quick:['¿Qué es la mitosis?','Diferencia ADN y ARN','¿Cómo funciona la fotosíntesis?','¿Qué es enlace covalente?']},
    {id:'hist_m',name:'Historia y Geografía',sub:'Chile · América · Mundo · PAES',icon:'🌎',bg:'#fff7ed',topics:['Independencia Chile','S. XX Chile','Guerra Fría','Globalización','Geografía física','DDHH'],quick:['¿Cómo fue la Independencia de Chile?','¿Qué fue la Unidad Popular?','¿Qué es la Guerra Fría?','¿Qué son los DDHH?']},
    {id:'leng_m',name:'Lenguaje',sub:'Comprensión lectora · Escritura · PAES',icon:'📖',bg:'#fdf4ff',topics:['Comprensión lectora','Tipos de textos','Figuras literarias','Argumentación','Ortografía','Redacción'],quick:['¿Qué es una metáfora?','Texto expositivo vs argumentativo','¿Cómo identifico la idea principal?','¿Cómo redacto un ensayo?']},
    {id:'ing_m',name:'Inglés',sub:'Gramática · Vocabulario · Reading',icon:'🇬🇧',bg:'#eff4ff',topics:['Tiempos verbales','Vocabulario','Reading comprehension','Writing','Phrasal verbs','Modal verbs'],quick:['Present perfect vs simple past','¿Cómo uso el condicional?','¿Qué son phrasal verbs?','Estrategias para el reading']},
    {id:'filo_m',name:'Filosofía',sub:'Lógica · Ética · Epistemología',icon:'🧠',bg:'#fdf4ff',topics:['Lógica básica','Ética','Epistemología','Metafísica','Filósofos clave','Argumentación'],quick:['¿Qué es la filosofía?','¿Qué dijo Platón?','Diferencia ética vs moral','¿Qué es un argumento válido?']},
  ]
};

let level='u',current=data.u[0],mode='explicar',history=[];
const modeLabels={
  explicar:'¿Qué quieres que explique?',
  ejercicio:'¿Sobre qué tema quieres practicar?',
  prueba:'¿Qué tema quieres evaluar?'
};
const modeSys={
  explicar:`Eres un tutor experto. Cuando el estudiante pregunta algo, SIEMPRE entrega una explicación completa con: 1) definición clara, 2) ejemplo concreto con números o situación real chilena, 3) pasos o fórmulas si aplica. Usa markdown para dar formato. Usa LaTeX entre $$ para fórmulas matemáticas.`,
  ejercicio:`Eres un tutor experto. Cuando el estudiante menciona un tema, INMEDIATAMENTE genera un ejercicio completo así: 
**Ejercicio:** [enunciado concreto con números]
**Solución paso a paso:**
Paso 1: ...
Paso 2: ...
...
**Respuesta final:** ...
**Tip clave:** ...
SIEMPRE genera el ejercicio de inmediato, no preguntes ni esperes más información. Usa LaTeX entre $$ para fórmulas.`,
  prueba:`Eres un tutor experto. Cuando el estudiante menciona un tema, INMEDIATAMENTE genera exactamente 3 preguntas de prueba numeradas así:
**Mini prueba: [tema]**
**Pregunta 1:** ...
**Pregunta 2:** ...
**Pregunta 3:** ...
*Responde las 3 preguntas y luego te doy el resultado.*
NO entregues las respuestas todavía. Cuando el estudiante responda, evalúa cada una con ✅ o ❌ y explica la correcta.`
};

function setLevel(l,btn){
  level=l;
  document.querySelectorAll('.ltab').forEach(b=>b.classList.remove('active-u','active-m'));
  btn.classList.add(l==='u'?'active-u':'active-m');
  current=data[l][0];history=[];
  document.getElementById('messages').innerHTML='';
  document.getElementById('emptyState').style.display='block';
  buildSidebar();buildHeader();
}
function buildSidebar(){
  document.getElementById('subjectList').innerHTML=data[level].map(s=>`
    <div class="subj${s.id===current.id?(level==='u'?' active':' active-m'):''}" onclick="selectSubject('${s.id}')">
      <div class="subj-icon" style="background:${s.bg}">${s.icon}</div>
      <div><div class="subj-name">${s.name}</div><div class="subj-sub">${s.sub}</div></div>
    </div>`).join('');
}
function buildHeader(){
  const isM=level==='m';
  document.getElementById('mhIcon').textContent=current.icon;
  document.getElementById('mhIcon').style.background=current.bg;
  document.getElementById('mhTitle').innerHTML=`${current.name} <span class="level-badge ${isM?'lb-m':'lb-u'}">${isM?'Media':'Universidad'}</span>`;
  document.getElementById('mhSub').textContent=current.sub;
  document.getElementById('topicsRow').innerHTML=current.topics.map(t=>`<button class="tbtn" onclick="askTopic('${t}')">${t}</button>`).join('');
  document.getElementById('quickQ').innerHTML=current.quick.map(q=>`<button class="qbtn" onclick="askQuick('${q}')">${q}</button>`).join('');
}
function selectSubject(id){
  current=data[level].find(s=>s.id===id);
  history=[];
  document.getElementById('messages').innerHTML='';
  document.getElementById('emptyState').style.display='none';
  buildSidebar();buildHeader();
  // Auto-saludo al cambiar ramo
  addWelcome();
}
function addWelcome(){
  const msgs=document.getElementById('messages');
  const isM=level==='m';
  const welcome=`¡Hola! Soy tu tutor de **${current.name}**. Puedo explicarte cualquier tema, darte ejercicios resueltos o hacerte una mini prueba. ¿Por dónde empezamos?`;
  msgs.innerHTML=`<div class="msg msg-a"><div class="av${isM?' av-m':''}"></div><div class="ac"><div class="an${isM?' an-m':''}">TutorIA · ${current.name}</div><div class="ab">${renderMarkdown(welcome)}</div></div></div>`;
}
function setMode(btn){
  document.querySelectorAll('.mbtn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');mode=btn.dataset.mode;
  document.getElementById('inputLabel').textContent=modeLabels[mode];
  document.getElementById('userInput').placeholder=
    mode==='explicar'?'Ej: No entiendo las derivadas...':
    mode==='ejercicio'?'Ej: Quiero un ejercicio de integrales...':
    'Ej: Evalúame en límites...';
}
function askTopic(t){
  const prompts={
    explicar:`Explícame ${t}`,
    ejercicio:`Dame un ejercicio de ${t}`,
    prueba:`Hazme una mini prueba de ${t}`
  };
  document.getElementById('userInput').value=prompts[mode];
  sendMessage();
}
function askQuick(q){document.getElementById('userInput').value=q;sendMessage();}
function handleKey(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendMessage();}}

async function sendMessage(){
  const input=document.getElementById('userInput');
  const text=input.value.trim();
  if(!text)return;
  document.getElementById('emptyState').style.display='none';
  input.value='';
  const msgs=document.getElementById('messages');
  msgs.innerHTML+=`<div class="msg msg-u"><div class="bu">${text}</div></div>`;
  const isM=level==='m';
  const tid='t'+Date.now();
  msgs.innerHTML+=`<div class="msg msg-a" id="${tid}"><div class="av${isM?' av-m':''}"></div><div class="ac"><div class="an${isM?' an-m':''}">TutorIA · ${current.name}</div><div class="typing"><span></span><span></span><span></span></div></div></div>`;
  msgs.scrollTop=msgs.scrollHeight;
  document.getElementById('sendBtn').disabled=true;
  history.push({role:'user',content:text});
  const lvlText=isM?'estudiante de enseñanza media chilena (currículo MINEDUC)':'estudiante universitario chileno';
  const system=`${modeSys[mode]} Eres tutor de ${current.name} para ${lvlText}. Temas del ramo: ${current.topics.join(', ')}. Responde siempre en español. Usa ejemplos cotidianos chilenos cuando sea posible.`;
  try{
    const res=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,system,max_tokens:1000})});
    if(!res.ok)throw new Error(`Error ${res.status}: ${await res.text()}`);
    const d=await res.json();
    const reply=d.content?.find(b=>b.type==='text')?.text||'Sin respuesta.';
    history.push({role:'assistant',content:reply});
    document.getElementById(tid).remove();
    const rendered=renderMarkdown(reply);
    const msgEl=document.createElement('div');
    msgEl.className='msg msg-a';
    msgEl.innerHTML=`<div class="av${isM?' av-m':''}"></div><div class="ac"><div class="an${isM?' an-m':''}">TutorIA · ${current.name}</div><div class="ab">${rendered}</div></div>`;
    msgs.appendChild(msgEl);
  }catch(e){
    document.getElementById(tid).remove();
    msgs.innerHTML+=`<div class="msg msg-a"><div class="av">❌</div><div class="ac"><div class="ab"><div class="err">${e.message}</div></div></div></div>`;
  }
  msgs.scrollTop=msgs.scrollHeight;
  document.getElementById('sendBtn').disabled=false;
  input.focus();
}
buildSidebar();buildHeader();
</script>
</body>
